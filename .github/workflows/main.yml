name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/qeyasat

          if [ -f MainActivity.kt ]; then
            cp MainActivity.kt app/src/main/java/com/example/qeyasat/MainActivity.kt
          fi

          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }

              plugins {
                  id("com.android.application") version "8.5.2"
                  id("org.jetbrains.kotlin.android") version "1.9.24"
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Qiyasat"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          // Root project
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.qeyasat"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.qeyasat"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "===== CHECK ====="
          cat settings.gradle.kts
          echo "===== APP ====="
          cat app/build.gradle.kts
          echo "===== FILES ====="
          find app -type f

      - name: Check required files
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/qeyasat/MainActivity.kt
          echo "ALL REQUIRED FILES FOUND"

      - name: Build APK
        shell: bash
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qiyasat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
